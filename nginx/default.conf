server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # SPA fallback — route all requests to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Immutable caching for built assets. This location defines its own
  # add_header, so the shared security headers must be included again.
  location /assets {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
  }
}
