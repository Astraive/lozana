# Shared HTTP hardening headers for the Lozana dashboard.
#
# Included both at server level and inside every location block that emits
# its own add_header directive: nginx does not inherit add_header values from
# a parent level once a location defines any add_header of its own.

# Restrictive CSP. The app and its assets are served from 'self'. The
# jsdelivr origin is allowed only because @monaco-editor/react loads the
# editor's AMD modules/workers from there by default; self-hosting Monaco
# would let this origin be removed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
