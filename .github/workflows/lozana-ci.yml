name: Lozana CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - "Dockerfile"
      - ".dockerignore"
      - "nginx/**"
      - ".env.example"
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "Dockerfile"
      - "vite-env.d.ts"
      - ".github/workflows/lozana-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - "Dockerfile"
      - ".dockerignore"
      - "nginx/**"
      - ".env.example"
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "Dockerfile"
      - "vite-env.d.ts"
      - ".github/workflows/lozana-ci.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Check env var docs/code agreement
        run: bun run check:env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level high

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test (with minimum count gate)
        run: bun run test:ci
